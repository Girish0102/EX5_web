<!DOCTYPE html>
<html>
<head>
    <title>Shortest and Longest Word</title>
</head>
<body>

<h1>Find Shortest and Longest Word</h1>

<input type="text" id="sentence" value="Web Development Tutorial">
<button onclick="findWords()">Find Words</button>

<p>Shortest: <span id="shortest"></span></p>
<p>Longest: <span id="longest"></span></p>

<script>
function findWords() {
    var text = document.getElementById("sentence").value;
    var words = text.split(" ");

    var shortest = words[0];
    var longest = words[0];

    for (var i = 1; i < words.length; i++) {
        if (words[i].length < shortest.length) {
            shortest = words[i];
        }

        if (words[i].length > longest.length) {
            longest = words[i];
        }
    }

    document.getElementById("shortest").innerHTML = shortest;
    document.getElementById("longest").innerHTML = longest;
}
</script>

</body>
</html>
